name: Build and Push PostgreSQL Multi-Arch Images

on:
  release:
    types: [created]

  workflow_dispatch:
    inputs:
      version:
        description: "vchord version (example: 1.0.0-1)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Validate version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const version =
              "${{ github.event.inputs.version }}" !== ""
                ? "${{ github.event.inputs.version }}"
                : "${{ github.event.release.tag_name }}";

            console.log(`Version: ${version}`);

            const r = /^\d+\.\d+\.\d+$/;
            if (!r.test(version)) {
              core.setFailed("Invalid version format. Expected X.Y.Z-N");
            }

            core.setOutput("VERSION", version);

  build-and-push:
    needs: validate-version
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        pg_version: [ "14", "15", "16", "17" , "18" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            POSTGRES_VERSION=${{ matrix.pg_version }}
            VCHORD_VERSION=${{ needs.validate-version.outputs.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.pg_version }}-vchord_${{ needs.validate-version.outputs.VERSION }}